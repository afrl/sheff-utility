image: gcc:9.4.0

build:
  stage: build

  before_script:
  - echo "Prebuild, installing prerequisites"
  - apt-get update && apt-get -y install cmake && apt-get -y install python3-dev python3-pip python3-numpy
  - git clone https://gitlab-ci-token:${CI_JOB_TOKEN}@git.act3-ace.com/sheff/dev_tools.git
  - python3 --version
  - python3 -m pip install -r ./dev_tools/requirements.txt
  - export SHEFF_TOOLS=$PWD/dev_tools
  - export PYTHONPATH=$SHEFF_TOOLS:$PYTHONPATH
  # It appears they blocked using the CI_JOB_TOKEN to access another project's artifacts for non-premium users
  # I am using a workaround with a repo access token
  - test -d ./json || curl --location --output artifacts.zip "https://git.act3-ace.com/api/v4/projects/818/jobs/artifacts/main/download?job=build&job_token=$CI_JOB_TOKEN" && unzip artifacts.zip && rm artifacts.zip
  # now, there will be a path: json/install_dir

  # Theoretically, this should allow easy access to the artifacts in the other project, but it has a bug
  # see https://gitlab.com/gitlab-org/gitlab/-/issues/228586
  #needs:
  #  - project: rxcc_computation/third_party/nlohmann_json
  #    job: build
  #    ref: main
  #    artifacts: true
  script:
    - python3 make.py --config --build --verbose --make-tests --test
    # I should have make.py exit with code 1 when an error occurs.  For now, use ls to fail if build failed.
    - ls install_dir/lib

  artifacts:
    untracked: true

pages:
  stage: deploy
  before_script:
  - echo "Prebuild, installing prerequisites"
  - apt-get update && apt-get -y install doxygen
  script:
    - cd docs
    - doxygen Doxyfile
    - cd ../
    - mkdir public
    - cp -r docs/html/* public/
  artifacts:
    paths:
      - public
